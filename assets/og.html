<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #1D1109; --line: #46301c; --ink: #F4EADE; --mist: #cbb6a2;
    --accent: #56C6E8; --track: #3a2614; --defer: #F0A55A;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: var(--sans); color: var(--ink);
    background:
      radial-gradient(1100px 560px at 88% -12%, rgba(86,198,232,0.16), transparent 60%),
      radial-gradient(720px 460px at 2% 8%, rgba(240,165,90,0.09), transparent 55%),
      linear-gradient(180deg, #241610 0%, #1D1109 100%);
    -webkit-font-smoothing: antialiased;
  }
  .frame { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }

  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 60px; height: 60px; }
  .wordmark { font-size: 50px; font-weight: 800; letter-spacing: -0.035em; }
  .wordmark .tag { color: var(--accent); }

  .mid { display: flex; align-items: center; gap: 52px; }
  .headline { max-width: 640px; }
  .headline h1 { font-size: 62px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  .headline h1 .hl { color: var(--accent); }
  .headline p { margin-top: 22px; font-size: 27px; font-weight: 500; color: var(--mist); line-height: 1.34; max-width: 24ch; }

  /* the eligibility ring — shared motif, mid-fill */
  .ringwrap { position: relative; width: 300px; height: 300px; flex: none; }
  .ringwrap svg { width: 100%; height: 100%; }
  .ringwrap .ctr { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ctr .big { font-size: 78px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .ctr .small { font-size: 21px; color: var(--mist); margin-top: 4px; }

  .chips { display: flex; gap: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px;
    border: 1px solid var(--line); border-radius: 999px; background: rgba(0,0,0,0.28);
    font-size: 21px; font-weight: 600; color: var(--mist);
  }
  .chip .dot { width: 11px; height: 11px; border-radius: 50%; }
  .chip .dot--cyan { background: var(--accent); box-shadow: 0 0 0 4px rgba(86,198,232,0.16); }
  .chip .dot--amber { background: var(--defer); box-shadow: 0 0 0 4px rgba(240,165,90,0.16); }
</style>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="80" fill="none" stroke="#3a2614" stroke-width="16"/>
        <path d="M100 20 A80 80 0 0 1 169.28 140" fill="none" stroke="#56C6E8" stroke-width="16" stroke-linecap="round"/>
        <circle cx="100" cy="20" r="12" fill="#56C6E8"/>
      </svg>
      <span class="wordmark">donorbook <span class="tag">· explained</span></span>
    </div>

    <div class="mid">
      <div class="headline">
        <h1>When can I <span class="hl">donate blood<br>again?</span> An honest answer.</h1>
        <p>How a free, offline tool turns cited national rules into one exact date.</p>
      </div>
      <div class="ringwrap">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="82" fill="none" stroke="#3a2614" stroke-width="18"/>
          <path d="M100 18 A82 82 0 1 1 42.6 152" fill="none" stroke="#56C6E8" stroke-width="18" stroke-linecap="round"/>
          <circle cx="100" cy="18" r="11" fill="#56C6E8"/>
        </svg>
        <div class="ctr">
          <span class="big">14</span>
          <span class="small">days to go</span>
        </div>
      </div>
    </div>

    <div class="chips">
      <span class="chip"><span class="dot dot--cyan"></span>cited NBTC / Red Cross / NHSBT</span>
      <span class="chip"><span class="dot dot--amber"></span>nothing leaves your browser</span>
      <span class="chip"><span class="dot dot--cyan"></span>fully offline</span>
    </div>
  </div>
</body>
</html>
